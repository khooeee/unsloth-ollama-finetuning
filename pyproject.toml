[project]
name = "unsloth-ollama-finetuning"
version = "0.1.0"
description = "Fine-tune Qwen3-0.6B with Unsloth MLX, export GGUF, run tool-use in a Docker sandbox via Ollama"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "unsloth",
    "unsloth_zoo",
    "mlx",
    "mlx-lm",
    "transformers",
    "datasets",
    "pyyaml",
    "requests",
    "tqdm",
    "protobuf",
    "sentencepiece",
    "gguf",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.uv]
package = false
