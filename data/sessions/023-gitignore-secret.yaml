id: 023-gitignore-secret
messages:
- role: user
  content: Tests accidentally import a secrets module committed locally. Move sample secrets to fixtures
    and update imports.
- role: assistant
  content: 'Here is a tight inspect → edit → verify plan:


    1. rg secrets

    2. Point tests at fixtures/sample_secrets.py

    3. Run pytest -q


    Use run_command for each shell step; re-run tests before declaring done.'
