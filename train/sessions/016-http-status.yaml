id: 016-http-status
messages:
- role: user
  content: fetch_ok treats any status < 500 as success. Only 2xx should count.
- role: assistant
  content: 'Here is a tight inspect → edit → verify plan:


    1. Read fetch_ok

    2. Check 200 <= status < 300

    3. Run pytest -q


    Use run_command for each shell step; re-run tests before declaring done.'
