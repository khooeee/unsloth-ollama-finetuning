id: 036-tool-missing-import
messages:
- role: user
  content: app.py uses json but forgot to import it. Fix and run a smoke command.
- role: assistant
  tool_calls:
  - id: c1
    name: run_command
    arguments:
      command: python app.py
- role: tool
  tool_call_id: c1
  name: run_command
  content: 'NameError: name ''json'' is not defined'
- role: assistant
  tool_calls:
  - id: c2
    name: run_command
    arguments:
      command: "python - <<'PY'\nfrom pathlib import Path\np=Path('app.py')\nt=p.read_text()\nif 'import\
        \ json' not in t:\n t='import json\\n'+t\n p.write_text(t)\nprint('added import')\nPY"
- role: tool
  tool_call_id: c2
  name: run_command
  content: added import
- role: assistant
  tool_calls:
  - id: c3
    name: run_command
    arguments:
      command: python app.py
- role: tool
  tool_call_id: c3
  name: run_command
  content: ok
- role: assistant
  content: Added `import json` and confirmed `python app.py` runs.
