messages:
- role: user
  content: nearly_equal uses == on floats. Use an epsilon.
- role: assistant
  tool_calls:
  - id: c1
    name: run_command
    arguments:
      command: pytest -q tests/test_float.py
- role: tool
  tool_call_id: c1
  name: run_command
  content: FAILED tests/test_float.py::test_sum - AssertionError
- role: assistant
  tool_calls:
  - id: c2
    name: run_command
    arguments:
      command: "python - <<'PY'\nfrom pathlib import Path\nPath('floats.py').write_text('''def nearly_equal(a,\
        \ b, eps=1e-9):\n    return abs(a - b) < eps\n''')\nprint('rewrote nearly_equal')\nPY"
- role: tool
  tool_call_id: c2
  name: run_command
  content: rewrote nearly_equal
- role: assistant
  tool_calls:
  - id: c3
    name: run_command
